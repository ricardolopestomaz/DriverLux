<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Frotas - DriverLux Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Georgia:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #7d12de;
            --primary-dark: #5b009f;
            --secondary: #8014e8;
            --accent: #ffc400;
            --accent-hover: #ffb300;
            --bg-dark: #440c77;
            --bg-light: #eee6f3;
            --text-dark: #2b0647;
            --text-light: #fff;
            --border: #d4c5e2;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #2a0545 100%);
            color: var(--text-dark);
            min-height: 100vh;
        }

        /* HEADER */
        header {
            background: rgba(59, 5, 103, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--secondary);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-admin {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-admin h1 {
            font-family: 'Georgia', serif;
            font-size: 24px;
            color: var(--text-light);
            font-weight: 700;
        }

        .logo-admin span {
            background: var(--secondary);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 900;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
            color: var(--text-light);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
        }

        .logout-btn {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: var(--accent);
            color: var(--text-dark);
        }

        /* MAIN LAYOUT */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* CATEGORY SELECTOR */
        .category-selector {
            background: white;
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .category-selector h2 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 10px;
            color: var(--text-dark);
        }

        .category-selector p {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .category-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .category-btn {
            padding: 25px 20px;
            border: 3px solid var(--border);
            background: white;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-weight: 700;
            font-size: 16px;
        }

        .category-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(125, 18, 222, 0.15);
            border-color: var(--primary);
        }

        .category-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-color: var(--primary);
            box-shadow: 0 15px 40px rgba(125, 18, 222, 0.3);
        }

        .category-btn .value {
            display: block;
            font-size: 28px;
            margin: 10px 0;
            font-weight: 900;
            color: var(--primary);
        }

        .category-btn.active .value {
            color: var(--accent);
        }

        .category-btn .description {
            display: block;
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }

        .category-btn.active .description {
            color: rgba(255, 255, 255, 0.8);
        }

        /* FLEET MANAGEMENT */
        .fleet-section {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .fleet-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .fleet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .fleet-header h3 {
            font-size: 28px;
            font-weight: 900;
            color: var(--text-light);
        }

        .add-vehicle-btn {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-weight: 900;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .add-vehicle-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(125, 18, 222, 0.4);
        }

        /* VEHICLES TABLE */
        .vehicles-grid {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .vehicles-table {
            width: 100%;
            border-collapse: collapse;
        }

        .vehicles-table thead {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: white;
        }

        .vehicles-table th {
            padding: 20px;
            text-align: left;
            font-weight: 900;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .vehicles-table tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }

        .vehicles-table tbody tr:hover {
            background: #f9f7fb;
        }

        .vehicles-table td {
            padding: 18px 20px;
        }

        .vehicle-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .vehicle-thumb {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            background: var(--bg-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .vehicle-details h4 {
            font-weight: 900;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .vehicle-details small {
            color: #999;
            font-size: 12px;
        }

        .price-input {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .price-input input {
            width: 100px;
            padding: 8px 12px;
            border: 2px solid var(--border);
            border-radius: 6px;
            font-weight: 700;
            color: var(--primary);
        }

        .price-input span {
            font-weight: 700;
            color: var(--text-dark);
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .status-disponivel {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .status-indisponivel {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background: transparent;
            border: 2px solid transparent;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .edit-btn {
            color: var(--primary);
            border-color: var(--primary);
        }

        .edit-btn:hover {
            background: var(--primary);
            color: white;
        }

        .delete-btn {
            color: var(--danger);
            border-color: var(--danger);
        }

        .delete-btn:hover {
            background: var(--danger);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            opacity: 0.3;
            margin-bottom: 20px;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease-out;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 24px;
            font-weight: 900;
            color: var(--text-dark);
        }

        .close-modal {
            background: transparent;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
            transition: color 0.2s;
        }

        .close-modal:hover {
            color: var(--text-dark);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: border 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-group input[type="number"] {
            color: var(--primary);
            font-weight: 700;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .modal-footer {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid var(--border);
        }

        .modal-footer button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 900;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .btn-save {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: white;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(125, 18, 222, 0.3);
        }

        .btn-cancel {
            background: var(--bg-light);
            color: var(--text-dark);
        }

        .btn-cancel:hover {
            background: var(--border);
        }

        /* LOADING & TOAST */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            color: var(--primary);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: white;
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            z-index: 2000;
            animation: slideInRight 0.3s ease-out;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .toast.success {
            border-left: 4px solid var(--success);
            color: var(--success);
        }

        .toast.error {
            border-left: 4px solid var(--danger);
            color: var(--danger);
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 15px 20px;
            }

            .container {
                padding: 20px 15px;
            }

            .category-selector {
                padding: 25px;
            }

            .category-buttons {
                grid-template-columns: 1fr;
            }

            .vehicles-table {
                font-size: 13px;
            }

            .vehicles-table th,
            .vehicles-table td {
                padding: 12px 10px;
            }

            .modal-content {
                padding: 25px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .vehicles-grid {
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-admin">
            <h1>DRIVERLUX</h1>
            <span>ADMIN</span>
        </div>
        <div class="user-info">
            <div>
                <div style="font-weight: 900;">Administrador</div>
                <small style="opacity: 0.7;">Gestão de Frotas</small>
            </div>
            <div class="user-avatar">AD</div>
            <button class="logout-btn" onclick="logout()">SAIR</button>
        </div>
    </header>

    <div class="container">
        <!-- CATEGORY SELECTOR -->
        <div class="category-selector">
            <h2>Selecione a Categoria</h2>
            <p>Escolha qual tipo de frota você deseja gerenciar</p>
            <div class="category-buttons">
                <button class="category-btn" onclick="selectCategory(1, 'ECONÔMICO', this)">
                    <span>🚗</span>
                    ECONÔMICO
                    <span class="value">Básico</span>
                    <span class="description">Carros populares e eficientes</span>
                </button>
                <button class="category-btn" onclick="selectCategory(2, 'PLUS', this)">
                    <span>🏎️</span>
                    PLUS
                    <span class="value">Premium</span>
                    <span class="description">Carros executivos e confortáveis</span>
                </button>
                <button class="category-btn" onclick="selectCategory(3, 'MAX', this)">
                    <span>🏁</span>
                    MAX
                    <span class="value">Luxo</span>
                    <span class="description">Supercarros e veículos exclusivos</span>
                </button>
            </div>
        </div>

        <!-- FLEET MANAGEMENT -->
        <div id="fleetSection" class="fleet-section">
            <div class="fleet-header">
                <h3 id="fleetTitle">Carros - ECONÔMICO</h3>
                <button class="add-vehicle-btn" onclick="openModal()">
                    <span>+</span> Adicionar Veículo
                </button>
            </div>

            <div class="vehicles-grid">
                <div id="vehiclesContainer">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div id="vehicleModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Adicionar Veículo</h2>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>

            <form id="vehicleForm" onsubmit="saveVehicle(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>Marca *</label>
                        <input type="text" id="marca" placeholder="Ex: BMW" required>
                    </div>
                    <div class="form-group">
                        <label>Modelo *</label>
                        <input type="text" id="modelo" placeholder="Ex: M4 Competition" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Ano *</label>
                        <input type="number" id="ano" placeholder="Ex: 2024" min="2000" max="2099" required>
                    </div>
                    <div class="form-group">
                        <label>Placa *</label>
                        <input type="text" id="placa" placeholder="Ex: ABC1234" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Chassi *</label>
                        <input type="text" id="chassi" placeholder="Ex: 12345678901234567" required>
                    </div>
                    <div class="form-group">
                        <label>Preço Diária (R$) *</label>
                        <input type="number" id="valor_base_diaria" placeholder="Ex: 1200" min="0" step="0.01" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Status de Disponibilidade</label>
                    <select id="status_disponibilidade">
                        <option value="disponivel">Disponível</option>
                        <option value="alugado">Alugado</option>
                        <option value="manutencao">Manutenção</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>URL da Imagem</label>
                    <input type="url" id="imagem_url" placeholder="https://exemplo.com/imagem.jpg">
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn-save">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../Veiculos/admin-veiculos.js"></script>
</body>
</html>
